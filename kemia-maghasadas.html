let rodSlider = null, autoBtn = null;
Lesson.create({
  subject: 'Kémia', title: 'A maghasadás működése',
  steps: [
    { title: 'Az atommag: sűrű nukleon­csomag',
      text: `<p>Az atom közepén parányi, de elképesztően sűrű mag ül: <span class="key">protonok</span> (pozitív töltésűek) és <span class="key2">neutronok</span> (semlegesek) szoros halmaza.</p><p>Az <b>urán-235</b> magjában <span class="fx">92 p + 143 n</span> zsúfolódik össze.</p><p class="note">A protonszám dönti el, melyik elemről van szó; a neutronszám azt, hogy melyik izotópjáról.</p>`,
      enter() { if (NS.mode !== 'u235') { restore(SNAP235, 'u235'); } } },
    { title: 'Miért billeg a nagy atommag?',
      text: `<p>A magot az <span class="key2">erős kölcsönhatás</span> tartja össze – de csak a közvetlen szomszédok között hat, mint a ragasztó.</p><p>A protonok <span class="key">elektromos taszítása</span> viszont az egész magon átér. 92 protonnál a két hatás már majdnem kiegyenlíti egymást: a mag úgy remeg, mint egy <em>túl nagyra nőtt vízcsepp</em>.</p>`,
      enter() { if (NS.mode !== 'u235') restore(SNAP235, 'u235'); } },
    { title: 'Egy lassú neutron betalál',
      text: `<p>A neutronnak nincs töltése, ezért a mag nem taszítja: egy <span class="key2">lassú neutron</span> akadálytalanul becsúszik.</p><p>A befogáskor energia szabadul fel, így <span class="key">gerjesztett urán-236</span> keletkezik: <span class="fx">²³⁵U + n → ²³⁶U*</span></p><p>A „csepp” vadul rezegni kezd…</p>`,
      enter() { restore(SNAP235, 'u235'); NS.nAlpha = 0; NS.x[235] = -27; NS.y[235] = .4; NS.z[235] = 0; } },
    { title: 'A hasadás – lassítva',
      text: `<p>A rezgő mag <b>megnyúlik</b>, középen <b>befűződik</b>. A két fél között az erős kölcsönhatás már nem ér át – a <span class="key">taszítás</span> győz, és a mag <b>kettészakad</b>.</p><p>Két közepes mag (itt bárium és kripton), <span class="key2">2–3 gyors neutron</span> és gamma-sugárzás keletkezik.</p><p class="note">A valóságban mindez a másodperc billiomod részénél is rövidebb.</p>`,
      enter() { if (NS.mode !== 'u236') restore(SNAP236, 'u236'); NS.nAlpha = 1; NS.qAmp = 5; assignLobes(); } },
    { title: 'Honnan jön az energia?',
      text: `<p>A közepes magokban a nukleonok <b>szorosabban kötöttek</b>, mint az uránban. A különbség nukleononként ≈ 0,9 MeV – ez szabadul fel.</p><p>A termékek össztömege kb. 0,1%-kal kisebb: a „hiányzó” tömeg energiává vált.</p><span class="big-fx">E = mc²</span><p class="note">Egy szénatom elégése ≈ 4 eV – egy hasadás ötvenmilliószor ennyi.</p>` },
    { title: 'Láncreakció: 1 → 3 → 9 → …',
      text: `<p>Minden hasadás 2–3 új neutront szabadít fel. Ha ezek újabb urán-235 magokat találnak el, a folyamat <span class="key">önmagát gyorsítja</span>: a hasadások száma generációról generációra sokszorozódik.</p><p>Indíts el <b>egyetlen</b> neutront, és figyeld a generációkat!</p>`,
      enter() { csSetup('chain'); CS.dispG = []; CS.autoAt = 3.2; },
      controls(L) { L.button('Neutron indítása', () => launchChain()); L.button('Újra', () => L.replay()); } },
    { title: 'Kritikus tömeg: a <em>k</em> tényező',
      text: `<p>Kis tömbből a neutronok többsége <b>kiszökik</b>, mielőtt magot találna. A <span class="key">k</span> megmutatja, hány újabb hasadást okoz átlagosan egy hasadás.</p><ul><li><span class="fx">k &lt; 1</span> a reakció elhal</li><li><span class="fx">k = 1</span> állandó ütem (reaktor)</li><li><span class="fx">k &gt; 1</span> megszalad</li></ul>`,
      enter() { CS.Rf = RCRIT * .62; csSetup('crit'); },
      controls(L) { L.slider({ label: 'Az urángömb mérete', min: .45, max: 1.7, step: .01, value: .62, format: (v) => '≈ ' + (52 * v ** 3 < 20 ? hu(52 * v ** 3, 1) : Math.round(52 * v ** 3)) + ' kg', onInput: (v) => setRf(RCRIT * v) }); } },
    { title: 'A megszelídített láncreakció',
      text: `<p>A <span class="key2">moderátor</span> (víz) lelassítja a gyors neutronokat – a lassú neutron sokkal nagyobb eséllyel hasít.</p><p>A bórtartalmú <span class="key">szabályozórudak</span> elnyelik a fölösleget. A cél: pontosan <span class="fx">k = 1</span>.</p>`,
      enter() { csSetup('reactor'); },
      controls(L) {
        rodSlider = L.slider({ label: 'Szabályozórudak benyúlása', min: 5, max: 100, step: 1, value: 56, format: (v) => Math.round(v) + ' %', onInput: (v) => { CS.auto = false; CS.rodT = v / 100; autoBtn.classList.remove('on'); } });
        autoBtn = L.button('Automata', (b) => { CS.auto = !CS.auto; b.classList.toggle('on', CS.auto); }); autoBtn.classList.add('on');
        L.button('Vészleállítás', () => { CS.auto = false; CS.rodT = 1; CS.warn = 3; autoBtn.classList.remove('on'); });
        CS.onScram = () => autoBtn && autoBtn.classList.remove('on');
      },
      leave() { rodSlider = null; } },
    { title: 'Atomerőmű: hasadásból áram',
      text: `<p>Pakson négy <b>nyomottvizes reaktor</b> működik. A hasadás hője a zárt <span class="key">primer kör</span> vizét melegíti; ez a gőzfejlesztőben a <span class="key2">szekunder kör</span> vizéből gőzt fejleszt, a gőz turbinát, az pedig generátort hajt.</p><p class="note">Az urán energiasűrűsége milliószoros, szén-dioxid nem keletkezik – a kiégett fűtőelemek biztonságos tárolása viszont komoly felelősség.</p>` },
  ],
  init(L) {
    SP_P = sphereSprites('#ffd2c2', '#ff7a55', '#8a2412'); SP_N = sphereSprites('#f2f6ff', '#9db1cf', '#2c3955');
    MINI = makeMini(false); MINI_DEAD = makeMini(true); nsInit(); makeEq(L);
  },
  draw(L) {
    const ctx = L.ctx; drawBg(ctx, L);
    const f = clamp(L.sp, 0, 8), i = Math.round(f), sc = SCENE[i], j = f > i ? i + 1 : i - 1; let fade = 0;
    if (j >= 0 && j <= 8 && SCENE[j] !== sc) fade = Math.min(1, Math.abs(f - i) * 2);
    ctx.save();
    if (sc === 0) drawA(ctx, L); else if (sc === 1) drawB(ctx, L); else if (sc === 2) drawC(ctx, L); else drawD(ctx, L);
    ctx.restore();
    if (fade > 0) { ctx.save(); ctx.globalAlpha = smooth(fade); drawBg(ctx, L); ctx.restore(); }
    updEq(L);
    if (rodSlider && L.step === 7 && document.activeElement !== rodSlider.input) rodSlider.set(CS.rod * 100);
  },
});
})();
</script>
</body>
</html>
