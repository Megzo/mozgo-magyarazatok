<script src="data/informatika-mnist.js"></script>
<script>
(function () {
'use strict';
const D = window.MNIST_DATA, U = Lesson.U, TAU = Math.PI * 2;
const LIME = [182, 255, 60], POS = [47, 230, 255], NEG = [255, 61, 154], INK = [234, 255, 214];
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const F = {
  d: (s, w = 560, it = '') => `${it} ${w} ${s}px Fraunces`,
  b: (s, w = 500) => `${w} ${s}px "Bricolage Grotesque"`,
  m: (s, w = 500) => `${w} ${s}px "JetBrains Mono"`,
};
const sm = U.smooth;
const fmt = (v, d = 2) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d).replace('.', ',');
const fmtS = (v, d = 2) => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(d).replace('.', ',');
const thousands = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const pctTxt = (p, d = 1) => (p * 100).toFixed(d).replace('.', ',') + ' %';

/* ───────────── adatok dekódolása ───────────── */
function dec(s, T) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return T === Uint8Array ? u : new T(u.buffer); }
const SZ = D.sizes;
const Wf = D.W.map((w) => { const q = dec(w.q, Int8Array), f = new Float32Array(q.length); for (let i = 0; i < q.length; i++) f[i] = q[i] * w.s; return f; });
const Bf = D.b.map((b) => Float32Array.from(b));
const SNAP = D.snaps.map((s) => ({ seen: s.seen, s: s.s, q: dec(s.q, Int8Array) }));
const SPX = dec(D.samples.px, Uint8Array), SY = D.samples.y, NS = D.samples.n;
const MPX = dec(D.mis.px, Uint8Array);
const SX = new Float32Array(NS * 784); for (let i = 0; i < SX.length; i++) SX[i] = SPX[i] / 255;
const sampleX = (k) => SX.subarray(k * 784, k * 784 + 784);
const N_PARAMS = SZ[0] * SZ[1] + SZ[1] + SZ[1] * SZ[2] + SZ[2] + SZ[2] * SZ[3] + SZ[3];
const KTOP = 4;

/* ───────────── a háló ───────────── */
function newState() {
  return {
    x: new Float32Array(784), dx: new Float32Array(784),
    a: [new Float32Array(SZ[1]), new Float32Array(SZ[2]), new Float32Array(SZ[3])],
    da: [new Float32Array(SZ[1]), new Float32Array(SZ[2]), new Float32Array(SZ[3])],
    z1: new Float32Array(SZ[1]),
    top: new Int16Array(SZ[1] * KTOP).fill(-1), topv: new Float32Array(SZ[1] * KTOP),
    cmax: [1, 1, 1], pred: -1, conf: 0, empty: true, wave: 0,
  };
}
function forward(S, x) {
  if (x !== S.x) S.x.set(x);
  let sum = 0; for (let i = 0; i < 784; i++) sum += S.x[i];
  S.empty = sum < 0.5;
  let inp = S.x;
  for (let l = 0; l < 3; l++) {
    const n = SZ[l + 1], m = SZ[l], W = Wf[l], o = S.a[l];
    for (let j = 0; j < n; j++) {
      let s = Bf[l][j]; const off = j * m;
      for (let i = 0; i < m; i++) s += W[off + i] * inp[i];
      if (l === 0) S.z1[j] = s;
      o[j] = l < 2 ? (s > 0 ? s : 0) : s;
    }
    inp = o;
  }
  const z = S.a[2]; let mx = -1e9; for (let j = 0; j < 10; j++) mx = Math.max(mx, z[j]);
  let tot = 0; for (let j = 0; j < 10; j++) { z[j] = Math.exp(z[j] - mx); tot += z[j]; }
  let best = 0; for (let j = 0; j < 10; j++) { z[j] /= tot; if (z[j] > z[best]) best = j; }
  S.pred = best; S.conf = z[best];
  // az 1. réteg minden neuronjához a KTOP legerősebb bemeneti hozzájárulás
  let c0 = 1e-6; const W = Wf[0];
  for (let j = 0; j < SZ[1]; j++) {
    const off = j * 784, tb = j * KTOP;
    for (let k = 0; k < KTOP; k++) { S.top[tb + k] = -1; S.topv[tb + k] = 0; }
    for (let i = 0; i < 784; i++) {
      const xi = S.x[i]; if (xi < 0.2) continue;
      const c = W[off + i] * xi, ac = Math.abs(c);
      let mk = 0; for (let k = 1; k < KTOP; k++) if (Math.abs(S.topv[tb + k]) < Math.abs(S.topv[tb + mk])) mk = k;
      if (ac > Math.abs(S.topv[tb + mk])) { S.topv[tb + mk] = c; S.top[tb + mk] = i; }
    }
    for (let k = 0; k < KTOP; k++) c0 = Math.max(c0, Math.abs(S.topv[tb + k]));
  }
  S.cmax[0] = c0;
  for (let l = 1; l < 3; l++) {
    let c = 1e-6; const n = SZ[l + 1], m = SZ[l], src = S.a[l - 1];
    for (let j = 0; j < n; j++) for (let i = 0; i < m; i++) c = Math.max(c, Math.abs(Wf[l][j * m + i] * src[i]));
    S.cmax[l] = c;
  }
}
function tick(S, dt, wave) {
  if (!(wave === wave)) wave = 0;
  const k = 1 - Math.exp(-dt * 12), kx = 1 - Math.exp(-dt * 14);
  for (let i = 0; i < 784; i++) S.dx[i] += (S.x[i] - S.dx[i]) * kx;
  for (let l = 0; l < 3; l++) {
    const f = S.empty ? 0 : sm(wave - l - 0.55), a = S.a[l], d = S.da[l];
    for (let j = 0; j < a.length; j++) d[j] += (a[j] * f - d[j]) * k;
  }
  S.wave = wave;
}

/* ───────────── sprite-ok, hőtérképek ───────────── */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function digitSprite(u8, off, col = INK) {
  const c = mkCanvas(28, 28), g = c.getContext('2d'), im = g.createImageData(28, 28);
  for (let i = 0; i < 784; i++) { im.data[i * 4] = col[0]; im.data[i * 4 + 1] = col[1]; im.data[i * 4 + 2] = col[2]; im.data[i * 4 + 3] = u8[off + i]; }
  g.putImageData(im, 0, 0); return c;
}
const sprites = []; for (let k = 0; k < NS; k++) sprites.push(digitSprite(SPX, k * 784));
const misSprites = []; for (let k = 0; k < D.mis.n; k++) misSprites.push(digitSprite(MPX, k * 784));
function heatInto(c, get, norm) { // get(i) → előjeles érték
  const g = c.getContext('2d'), im = g.createImageData(28, 28);
  for (let i = 0; i < 784; i++) {
    const v = get(i) / norm, col = v >= 0 ? POS : NEG, a = Math.pow(Math.min(1, Math.abs(v)), 0.75);
    im.data[i * 4] = col[0]; im.data[i * 4 + 1] = col[1]; im.data[i * 4 + 2] = col[2]; im.data[i * 4 + 3] = a * 255;
  }
  g.putImageData(im, 0, 0);
}
const heat = [], heatMax = [];
for (let j = 0; j < SZ[1]; j++) {
  let mx = 1e-6; for (let i = 0; i < 784; i++) mx = Math.max(mx, Math.abs(Wf[0][j * 784 + i]));
  heatMax.push(mx); const c = mkCanvas(28, 28); heatInto(c, (i) => Wf[0][j * 784 + i], mx); heat.push(c);
}
const glow = (() => { const c = mkCanvas(128, 128), g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, rgb(LIME, .9)); gr.addColorStop(.25, rgb(LIME, .35)); gr.addColorStop(1, rgb(LIME, 0)); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return c; })();
let bgCanvas = null;
function buildBg() {
  const c = mkCanvas(1920, 1080), g = c.getContext('2d');
  g.fillStyle = '#06080b'; g.fillRect(0, 0, 1920, 1080);
  let gr = g.createRadialGradient(520, 420, 0, 520, 420, 1100); gr.addColorStop(0, 'rgba(60,90,40,.20)'); gr.addColorStop(.5, 'rgba(20,40,40,.10)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
  gr = g.createRadialGradient(1500, 980, 0, 1500, 980, 800); gr.addColorStop(0, 'rgba(255,61,154,.07)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
  g.fillStyle = 'rgba(200,255,170,.10)';
  for (let y = 20; y < 1080; y += 40) for (let x = 20; x < 1920; x += 40) g.fillRect(x - 1, y - 1, 2, 2);
  g.fillStyle = 'rgba(200,255,170,.22)';
  for (let y = 20; y < 1080; y += 200) for (let x = 20; x < 1920; x += 200) { g.fillRect(x - 5, y - .5, 11, 1); g.fillRect(x - .5, y - 5, 1, 11); }
  gr = g.createRadialGradient(700, 540, 500, 700, 540, 1300); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
  bgCanvas = c;
}

/* ───────────── rajz-segédek ───────────── */
let ctx, GA = 1;
const al = (a) => { ctx.globalAlpha = Math.max(0, Math.min(1, GA * a)); };
function txt(s, x, y, font, color, align = 'left', base = 'alphabetic') { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function sprite(c, x, y, size) { ctx.imageSmoothingEnabled = false; ctx.drawImage(c, x, y, size, size); }
function frame(x, y, w, h, col = rgb(LIME, .5), len = 14) { // sarokjelek
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
  [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([px, py, sx, sy]) => { ctx.moveTo(px + sx * len, py); ctx.lineTo(px, py); ctx.lineTo(px, py + sy * len); });
  ctx.stroke();
}
function cells(x0, y0, cell, vals, a, gap = 1) { // 28×28 rács éles négyzetekkel
  al(a); ctx.fillStyle = '#0d1216'; ctx.fillRect(x0 - 3, y0 - 3, cell * 28 + 6 - gap, cell * 28 + 6 - gap);
  ctx.fillStyle = 'rgba(190,255,170,.055)';
  for (let r = 0; r < 28; r++) for (let c = 0; c < 28; c++) ctx.fillRect(x0 + c * cell, y0 + r * cell, cell - gap, cell - gap);
  ctx.fillStyle = rgb(INK);
  for (let i = 0; i < 784; i++) { const v = vals[i]; if (v < 0.02) continue; al(a * v); ctx.fillRect(x0 + (i % 28) * cell, y0 + ((i / 28) | 0) * cell, cell - gap, cell - gap); }
  al(a);
}

/* ───────────── a háló kirajzolása ───────────── */
function geom(o) {
  const col = (c, n) => { const p = []; for (let j = 0; j < n; j++) p.push([c.x, n === 1 ? c.y0 : U.lerp(c.y0, c.y1, j / (n - 1))]); return p; };
  o.n = [col(o.h1, SZ[1]), col(o.h2, SZ[2]), col(o.out, SZ[3])]; return o;
}
const G45 = geom({ ix: 50, iy: 372, cell: 12, h1: { x: 560, y0: 122, y1: 1002 }, h2: { x: 800, y0: 172, y1: 952 }, out: { x: 1030, y0: 172, y1: 952 }, r: [9, 13, 25], barX: 1076, barW: 168 });
const G8 = geom({ ix: 60, iy: 720, cell: 10, h1: { x: 770, y0: 122, y1: 1002 }, h2: { x: 955, y0: 172, y1: 952 }, out: { x: 1112, y0: 172, y1: 952 }, r: [9, 13, 25], barX: 1156, barW: 116 });

function drawNet(G, S, o) {
  const t = o.t, rev = o.rev, wave = S.empty ? -1 : S.wave;
  const inPos = (i) => [G.ix + (i % 28 + .5) * G.cell, G.iy + (((i / 28) | 0) + .5) * G.cell];
  // bemeneti rács
  if (rev[0] > 0.01) { cells(G.ix, G.iy, G.cell, S.dx, rev[0]); al(rev[0]); frame(G.ix - 12, G.iy - 12, G.cell * 28 + 23, G.cell * 28 + 23, rgb(LIME, .45)); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  // halvány szerkezeti élek
  for (let l = 1; l < 3; l++) {
    const ra = Math.min(rev[l], rev[l + 1]) * (o.structure || .5); if (ra < .01) continue;
    al(ra); ctx.strokeStyle = 'rgba(160,220,190,.05)'; ctx.lineWidth = 1; ctx.beginPath();
    const A = G.n[l - 1], B = G.n[l];
    for (let j = 0; j < B.length; j++) for (let i = 0; i < A.length; i++) { ctx.moveTo(A[i][0], A[i][1]); ctx.lineTo(B[j][0], B[j][1]); }
    ctx.stroke();
  }
  if (rev[1] > .01 && rev[0] > .01 && o.fan) { // bemenet → 1. réteg legyező (szerkezet)
    al(Math.min(rev[0], rev[1]) * o.fan); ctx.strokeStyle = 'rgba(160,220,190,.06)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let j = 0; j < SZ[1]; j++) for (let k = 0; k < 6; k++) { const i = (j * 97 + k * 131 + 45) % 784, p = inPos(i); ctx.moveTo(p[0], p[1]); ctx.lineTo(G.n[0][j][0], G.n[0][j][1]); }
    ctx.stroke();
  }
  // aktív élek
  if (!S.empty) {
    const edge = (x1, y1, x2, y2, c, cm, l, seed, ra) => {
      const inten = Math.abs(c) / cm; if (inten < .08) return;
      const lit = sm(wave - l), col = c >= 0 ? POS : NEG; if (lit < .01) return;
      al(ra * lit * Math.pow(inten, .75) * .78); ctx.strokeStyle = rgb(col); ctx.lineWidth = .8 + inten * 2.4;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      if (inten > .3) {
        const fr = wave - l; let ph = -1;
        if (fr > 0 && fr < 1) ph = fr; else if (fr >= 1) ph = (t * .45 + seed * .618) % 1;
        if (ph >= 0) { const px = U.lerp(x1, x2, ph), py = U.lerp(y1, y2, ph), s = (fr < 1 ? 5 : 3) + inten * 3; al(ra * (fr < 1 ? 1 : .7) * inten); ctx.fillStyle = rgb(col); ctx.beginPath(); ctx.arc(px, py, s * .5, 0, TAU); ctx.fill(); }
      }
    };
    const ra0 = Math.min(rev[0], rev[1]);
    if (ra0 > .01) for (let j = 0; j < SZ[1]; j++) for (let k = 0; k < KTOP; k++) { const i = S.top[j * KTOP + k]; if (i < 0) continue; const p = inPos(i); edge(p[0], p[1], G.n[0][j][0] - G.r[0], G.n[0][j][1], S.topv[j * KTOP + k], S.cmax[0], 0, j * KTOP + k, ra0); }
    for (let l = 1; l < 3; l++) {
      const ra = Math.min(rev[l], rev[l + 1]); if (ra < .01) continue;
      const A = G.n[l - 1], B = G.n[l], m = SZ[l], src = S.a[l - 1];
      for (let j = 0; j < B.length; j++) for (let i = 0; i < m; i++) { if (src[i] <= 0) continue; edge(A[i][0], A[i][1], B[j][0], B[j][1], Wf[l][j * m + i] * src[i], S.cmax[l], l, j * m + i, ra); }
    }
  }
  // csomópontok ragyogása
  for (let l = 0; l < 3; l++) {
    if (rev[l + 1] < .01) continue; const P = G.n[l], d = S.da[l];
    let mx = 1e-6; if (l < 2) { for (let j = 0; j < d.length; j++) mx = Math.max(mx, S.a[l][j]); } else mx = 1;
    for (let j = 0; j < P.length; j++) { const n = Math.min(1, d[j] / mx); if (n < .03) continue; const gs = G.r[l] * (3.2 + 2.6 * n); al(rev[l + 1] * n * .8); ctx.drawImage(glow, P[j][0] - gs, P[j][1] - gs, gs * 2, gs * 2); }
  }
  ctx.restore();
  // csomópontok
  for (let l = 0; l < 3; l++) {
    const ra = rev[l + 1]; if (ra < .01) continue; const P = G.n[l], d = S.da[l], r = G.r[l];
    let mx = 1e-6; if (l < 2) { for (let j = 0; j < d.length; j++) mx = Math.max(mx, S.a[l][j]); } else mx = 1;
    for (let j = 0; j < P.length; j++) {
      const n = Math.min(1, d[j] / mx), pop = U.outBack(U.clamp(ra * 1.5 - j / P.length * .5));
      al(ra); ctx.beginPath(); ctx.arc(P[j][0], P[j][1], r * pop, 0, TAU);
      ctx.fillStyle = U.mix('#0c1114', '#b6ff3c', Math.pow(n, .8)); ctx.fill();
      ctx.lineWidth = l === 2 ? 2 : 1.5; ctx.strokeStyle = rgb(LIME, .28 + .72 * n); ctx.stroke();
      if (l === 2) { txt(String(j), P[j][0], P[j][1] + 1, F.m(25, 700), n > .5 ? '#0b1400' : rgb(INK, .85), 'center', 'middle'); }
    }
  }
  // kimeneti oszlopok
  if (o.bars > .01 && rev[3] > .01) {
    const P = G.n[2], d = S.da[2];
    for (let j = 0; j < 10; j++) {
      const y = P[j][1], win = !S.empty && j === S.pred && wave > 2.9, p = d[j];
      al(o.bars * rev[3]); ctx.fillStyle = 'rgba(200,255,170,.07)'; ctx.fillRect(G.barX, y - 11, G.barW, 22);
      ctx.fillStyle = win ? rgb(LIME) : 'rgba(225,245,215,.5)'; ctx.fillRect(G.barX, y - 11, Math.max(0, G.barW * p), 22);
      if (win) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; al(o.bars * .35 * p); ctx.drawImage(glow, G.barX - 20, y - 40, G.barW * p + 40, 80); ctx.restore(); al(o.bars * rev[3]); }
      txt(Math.round(p * 100) + '%', G.barX + G.barW + 10, y + 1, F.m(22, win ? 700 : 500), win ? rgb(LIME) : rgb(INK, p > .05 ? .8 : .35), 'left', 'middle');
    }
  }
  al(1);
}
function netCaptions(G, rev, labels) {
  const xs = [G.ix + G.cell * 14, G.h1.x, G.h2.x, G.out.x + (labels.outShift || 0)];
  const ys = [G.iy - 62, 44, 44, 44];
  labels.t.forEach((s, i) => { if (!s) return; al(rev[i]); txt(s, xs[i], ys[i], F.b(24, 650), rgb(INK), 'center'); txt(labels.n[i], xs[i], ys[i] + 30, F.m(22, 600), rgb(LIME), 'center'); });
  al(1);
}

/* ───────────── jelenet-állapotok ───────────── */
const T = new Array(9).fill(0);
const S45 = newState(), S8 = newState(), S6 = newState();
const live = { k: 0, timer: 0, wave: 0, paused: false, order: [] };
{ const r = U.rng(11); live.order = [...Array(NS).keys()].sort(() => r() - .5); }
function liveSet(idx) { live.k = (idx + NS) % NS; forward(S45, sampleX(live.order[live.k])); live.timer = 0; S45.wave = 0; live.wave = 0; }

/* 1 ─ galéria */
const GAL = { n: 60, tiles: [], perm: [] };
{ const r = U.rng(5); for (let i = 0; i < GAL.n; i++) GAL.tiles.push({ k: i, c: i % 10, r: (i / 10) | 0, sx: (r() - .5) * 2600 + 680, sy: r() < .5 ? -300 - r() * 400 : 1380 + r() * 400, rot: (r() - .5) * 3, d: r() * 1.4, ph: r() * TAU }); GAL.perm = [...Array(GAL.n).keys()].sort(() => r() - .5); }
function scene1(t) {
  const tm = T[0];
  al(sm((tm - .1) / .6)); txt('MNIST ADATBÁZIS', 64, 70, F.m(22, 600), rgb(LIME));
  txt('70 000 kézzel írt számjegy', 62, 138, F.d(60, 520), rgb(INK));
  const sT = tm - 4.2, cyc = 5.6, kc = Math.max(0, Math.floor(sT / cyc)), lt = sT - kc * cyc;
  const dim = sT < 0 ? 0 : sm(lt / .5) * (1 - sm((lt - cyc + .7) / .6));
  const sel = GAL.perm[kc % GAL.n];
  for (const g of GAL.tiles) {
    const p = U.out((tm - .3 - g.d) / 1.1); if (p <= 0) continue;
    const tx = 62 + g.c * 124, ty = 205 + g.r * 126 + Math.sin(t * .9 + g.ph) * 4;
    const x = U.lerp(g.sx, tx, p), y = U.lerp(g.sy, ty, p);

    const draw = U.clamp(ph / .7), fade = 1 - sm((ph - .8) / .2);
    al(inA * .22 * fade); ctx.strokeStyle = rgb(LIME); ctx.lineWidth = 24; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); for (let i = 0; i <= 40; i++) { const p = at(draw * i / 40); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke();
    const p = at(draw); al(inA * .9 * fade); ctx.beginPath(); ctx.arc(p[0], p[1], 9, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
    al(inA * .8); txt('egérrel vagy ujjal', x + s / 2, y + s - 36, F.b(26), rgb(INK, .6), 'center');
  }
  ctx.restore();
  al(inA); txt('AMIT A HÁLÓ KAP · 28×28', G8.ix, G8.iy - 22, F.m(22, 600), rgb(INK, .6));
  ctx.strokeStyle = rgb(LIME, .4); ctx.lineWidth = 1.5; ctx.setLineDash([5, 6]); ctx.beginPath(); ctx.moveTo(x + s - 60, y + s + 6); ctx.lineTo(x + s - 60, y + s + 40); ctx.lineTo(G8.ix + 300, y + s + 40); ctx.stroke(); ctx.setLineDash([]);
  // válasz-kártya
  const kx = 372, ky = 742, kw = 246, kh = 262; al(inA); rr(kx, ky, kw, kh, 16); ctx.fillStyle = 'rgba(6,8,11,.94)'; ctx.fill(); ctx.strokeStyle = rgb(LIME, S8.empty ? .2 : .6); ctx.lineWidth = 1.5; ctx.stroke();
  txt('A HÁLÓ SZERINT', kx + kw / 2, ky + 40, F.m(22, 600), rgb(LIME), 'center');
  if (S8.empty) { txt('?', kx + kw / 2, ky + 182, F.d(150, 500), rgb(INK, .25 + .1 * Math.sin(t * 2)), 'center'); txt('még nincs rajz', kx + kw / 2, ky + 236, F.b(23), rgb(INK, .5), 'center'); }
  else { const sure = S8.conf > .6; txt(String(S8.pred), kx + kw / 2, ky + 184, F.d(160, 600), sure ? rgb(LIME) : rgb(INK, .75), 'center'); txt(Math.round(S8.conf * 100) + '% ' + (sure ? 'biztos' : '– bizonytalan'), kx + kw / 2, ky + 236, F.m(23, 600), sure ? rgb(INK) : rgb(NEG), 'center'); }
  al(1);
}

/* 9 ─ hol téved */
let dots = null;
function buildDots() {
  const c = mkCanvas(640, 640), g = c.getContext('2d'), r = U.rng(99), wrong = new Set(); while (wrong.size < D.nWrong) wrong.add((r() * 10000) | 0);
  for (let i = 0; i < 10000; i++) { const w = wrong.has(i); g.fillStyle = w ? rgb(NEG) : rgb(LIME, .32); const x = (i % 100) * 6.4, y = ((i / 100) | 0) * 6.4; if (w) g.fillRect(x - .6, y - .6, 5.4, 5.4); else g.fillRect(x + .6, y + .6, 3.4, 3.4); }
  dots = c;
}
function scene9(t) {
  const tm = T[8];
  al(sm(tm / .5)); txt('AMIT A HÁLÓ ELRONTOTT – VALÓDI TESZTKÉPEK', 60, 78, F.m(22, 600), rgb(NEG));
  for (let n = 0; n < Math.min(12, D.mis.n); n++) {
    const c = n % 6, r = (n / 6) | 0, p = U.outBack((tm - .3 - n * .09) / .5); if (p <= 0) continue;
    const X = 60 + c * 214, Y = 108 + r * 286;
    ctx.save(); ctx.translate(X + 84, Y + 84); ctx.scale(.6 + .4 * p, .6 + .4 * p); al(Math.min(1, p));
    ctx.fillStyle = '#0c1115'; ctx.fillRect(-84, -84, 168, 168); sprite(misSprites[n], -78, -78, 156); ctx.strokeStyle = rgb(NEG, .55); ctx.lineWidth = 1.5; ctx.strokeRect(-84.5, -84.5, 169, 169); ctx.restore();
    al(Math.min(1, p)); txt('valódi: ' + D.mis.y[n], X, Y + 204, F.b(25, 650), rgb(INK));
    txt('háló: ' + D.mis.pred[n] + ' · ' + Math.min(99, Math.floor(D.mis.conf[n] * 100)) + '%', X, Y + 236, F.m(22, 600), rgb(NEG));
  }
  const p2 = sm((tm - 1.6) / .8), dx = 60, dy = 716, ds = 320;
  if (p2 > .01) {
    al(p2); ctx.save(); ctx.beginPath(); ctx.rect(dx, dy, ds, ds * U.out((tm - 1.6) / 1.6)); ctx.clip(); ctx.imageSmoothingEnabled = true; ctx.drawImage(dots, dx, dy, ds, ds); ctx.restore();
    txt('10 000 tesztkép – egy pont egy kép', dx, dy - 16, F.m(22, 500), rgb(INK, .6));
    const cu = U.out((tm - 1.9) / 1.8), acc = D.acc * cu;
    txt(pctTxt(acc), 420, 838, F.d(128, 560), rgb(LIME));
    txt(thousands((10000 - D.nWrong) * cu) + ' helyes válasz', 426, 892, F.b(28, 600), rgb(INK));
    ctx.fillStyle = rgb(NEG); ctx.fillRect(426, 922, 18, 18); txt(thousands(D.nWrong * cu) + ' tévedés', 456, 940, F.m(24, 600), rgb(NEG));
    al(p2 * .7); txt('olyan képeken, amelyeket', 426, 984, F.b(22), rgb(INK, .8)); txt('tanulás közben sosem látott', 426, 1012, F.b(22), rgb(INK, .8));
  }
  const cards = [['KONVOLÚCIÓS HÁLÓ', ['A szomszédos képpontokat együtt', 'vizsgálja: 99,7% fölötti pontosság.'], POS], ['NAGY NYELVI MODELLEK', ['Ugyanaz az elv – súlyok, rétegek,', 'tanítás –, csak milliárdnyi súllyal.'], LIME]];
  cards.forEach(([h, lines, col], n) => { const p = sm((tm - 3.2 - n * .5) / .7), X = 880 + (1 - p) * 30, Y = 716 + n * 158; al(p); rr(X, Y, 450, 140, 14); ctx.fillStyle = 'rgba(8,11,14,.9)'; ctx.fill(); ctx.strokeStyle = rgb(col, .5); ctx.lineWidth = 1.5; ctx.stroke(); ctx.fillStyle = rgb(col); ctx.fillRect(X, Y + 18, 4, 104); txt(h, X + 26, Y + 42, F.m(22, 700), rgb(col)); lines.forEach((s, i) => txt(s, X + 26, Y + 82 + i * 32, F.b(24), rgb(INK, .9))); });
  al(1);
}

/* ───────────── lecke ───────────── */
let ctxdt = 0, L_step = 0, Lp = null;
const accTxt = Math.round(D.acc * 100);
Lesson.create({
  subject: 'Informatika',
  title: 'Kézzel írt számjegyek felismerése neurális hálóval (MNIST)',
  steps: [
    { title: 'A feladat: mit lát a gép?', text: `<p>Egy kézzel írt számjegyet te <span class="key">azonnal felismersz</span>. A számítógép viszont nem „lát”: számára a kép csak számok hosszú sora.</p><p>Az <b>MNIST</b> adatbázis 70 000 ilyen számjegyet tartalmaz – ezen tanult meg „olvasni” a gépi tanulás.</p><p class="note">Hogyan lesz a számokból felismerés? Nézzük lépésenként!</p>` },
    { title: 'A kép = 784 szám', text: `<p>Minden kép <span class="key">28 × 28 képpont</span>. Egy képpont egyetlen szám: 0 a fekete, 255 a fehér, közte a szürkék.</p><p>Ha a sorokat egymás után fűzzük, <span class="key2">784 számból álló oszlopot</span> kapunk – ez lesz a neurális háló bemenete.</p>`,
      enter() { S2.u = 0; S2.target = 0; S2.auto = true; },
      controls(L) { S2.btn = L.button('Kiterítés oszloppá', (b) => { S2.auto = false; S2.target = S2.target ? 0 : 1; b.textContent = S2.target ? 'Vissza rácsba' : 'Kiterítés oszloppá'; }); } },
    { title: 'Egy mesterséges neuron', text: `<p>A neuron minden bemenetét megszorozza egy <span class="key">súllyal</span>, összeadja, hozzáad egy <span class="key2">eltolást</span>, végül a <b>ReLU</b> a negatív eredményt nullára vágja.</p><p class="note">Állítsd a csúszkákat: mikor „tüzel” a neuron?</p>`,
      controls(L) {
        L.slider({ label: 'w₁ súly', min: -1, max: 1, step: .05, value: N3.w[0], format: (v) => fmtS(v), onInput: (v) => N3.w[0] = v });
        L.slider({ label: 'w₂ súly', min: -1, max: 1, step: .05, value: N3.w[1], format: (v) => fmtS(v), onInput: (v) => N3.w[1] = v });
        L.slider({ label: 'b eltolás', min: -1, max: 1, step: .05, value: N3.b, format: (v) => fmtS(v), onInput: (v) => N3.b = v });
      } },
    { title: 'A háló: neuronok rétegekben', text: `<p>Egy neuron keveset tud – <span class="key">sok neuron rétegekbe szervezve</span> viszont sokat. A 784 bemenet 32, majd 16 rejtett neuronon át jut el a 10 kimenetig: minden kimenet egy számjegy.</p><p>A <span class="key2">kék</span> kapcsolatok serkentenek, a <span class="neg">rózsaszínek</span> gátolnak.</p>`,
      enter() { live.paused = false; liveSet(live.k); } },
    { title: 'Előreterjesztés élőben', text: `<p>A kép balról belép, és a jel <span class="key">rétegről rétegre</span> halad: minden neuron kiszámolja a saját súlyozott összegét.</p><p>A kimeneten tíz valószínűség jelenik meg – a háló válasza a <span class="key">legerősebb</span>.</p><p class="note">Valódi tesztképek; a számítás itt, a böngészőben fut.</p>`,
      enter(L) { live.paused = false; if (L.prevStep !== 3) liveSet(live.k); },
      controls(L) { L.button('Következő számjegy', () => liveSet(live.k + 1)); L.button('Megállítás', (b) => { live.paused = !live.paused; b.textContent = live.paused ? 'Folytatás' : 'Megállítás'; b.classList.toggle('on', live.paused); }); } },
    { title: 'Mit „lát” egy neuron?', text: `<p>Az első réteg minden neuronjának 784 súlya van – éppen annyi, ahány képpont. Képként kirajzolva kiderül, <span class="key">milyen mintát keres</span>.</p><p><span class="key2">Kék</span>: itt örül a tintának. <span class="neg">Rózsaszín</span>: itt zavarja.</p><p class="note">Vidd az egeret egy neuronra; kattintással rögzítheted.</p>`,
      enter() { S6s.touched = false; S6s.lock = false; } },
    { title: 'Tanulás: lefelé a hibahegyen', text: `<p>Kezdetben a súlyok <b>véletlenek</b>, a háló csak találgat. Minden adag példa után megmérjük a <span class="neg">hibát</span>; a <b>visszaterjesztés</b> megmutatja, merre kell az egyes súlyokat picit állítani, hogy csökkenjen.</p><p>Ez a <span class="key">gradiensmódszer</span> – sok tízezerszer ismételve.</p>`,
      enter() { S7.u = 0; S7.playing = true; },
      controls(L) { S7.slider = L.slider({ label: 'A tanítás előrehaladása', min: 0, max: 1, step: .001, value: 0, format: (v) => Math.round(v * 100) + '%', onInput: (v) => { S7.u = v; S7.playing = false; } }); L.button('Újra az elejéről', () => { S7.u = 0; S7.playing = true; T[6] = 1.6; }); } },
    { title: 'Próbáld ki!', text: `<p>Rajzolj egy számjegyet a táblára! A háló <span class="key">minden vonásnál újraszámol</span> – figyeld, hogyan változnak a valószínűségek.</p><p class="note">Tipp: nagy, határozott számjegyeken tanult. Próbáld becsapni: mitől lesz egy 1-esből 7-es? Egy 3-asból 8-as?</p>`,
      enter() { if (!PAD.strokes.length && PAD.sample < 0) forward(S8, new Float32Array(784)); },
      controls(L) { L.button('Törlés', padClear); L.button('Véletlen példa', padSample); } },
    { title: 'Hol téved – és hogyan tovább?', text: `<p>Ez a kis háló a tesztképek <span class="key">kb. ${accTxt}%-át</span> eltalálja. A hibái között akad, amin mi is elgondolkodnánk – és akad, ami nekünk egyértelmű.</p><p>A mai képfelismerők és a <span class="key2">nagy nyelvi modellek</span> ugyanerre az elvre épülnek, csak sokkal nagyobb méretben.</p>` },
  ],
  init(L) {
    window.__mnist = { S8, S45, PAD, padClear };
    Lp = L; ctx = L.ctx; buildBg(); buildNums(); buildDots(); setupPad(L);
    forward(S45, sampleX(live.order[0])); forward(S8, new Float32Array(784));
    L.stage.addEventListener('pointerdown', (e) => { if (L.step !== 5) return; const h = tileAt(L.toStage(e)); if (h >= 0) { S6s.touched = true; if (S6s.lock && S6s.sel === h) S6s.lock = false; else { S6s.sel = h; S6s.lock = true; } } });
    L.stage.addEventListener('pointermove', () => { if (L.step === 5) S6s.touched = true; });
  },
  draw(L) {
    ctx = L.ctx; ctxdt = L.dt; L_step = L.step; const t = L.t;
    for (let i = 0; i < 9; i++) T[i] = i === L.step ? L.st : T[i] + L.dt;
    if (PAD.el) PAD.el.style.display = L.step === 7 ? 'block' : 'none';
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(bgCanvas, 0, 0, 1920, 1080);
    const vis = (i) => sm(1 - Math.abs(L.sp - i) * 1.7);
    const run = (i, fn) => { const v = vis(i); if (v < .004) return; ctx.save(); GA = v; const off = (i - L.sp) * 90; ctx.translate(off, 0); fn(t); ctx.restore(); GA = 1; ctx.globalAlpha = 1; };
    run(0, scene1); run(1, scene2); run(2, scene3);
    { // a 4. és 5. lépés ugyanazt a hálót használja
      const sp = L.sp, v4 = sp <= 3 ? vis(3) : 1 - sm(sp - 3), v5 = sp >= 4 ? vis(4) : sm(sp - 3);
      if (Math.max(v4, v5) > .004) { ctx.save(); const off = sp < 3 ? 3 - sp : sp > 4 ? 4 - sp : 0; ctx.translate(off * 90, 0); scene45(t, v4, v5); ctx.restore(); }
    }
    run(5, scene6); run(6, scene7); run(7, scene8); run(8, scene9);
    ctx.globalAlpha = 1;
  },
});
})();
