<script>
(function () {
  'use strict';
  const U = Lesson.U, D2R = Math.PI / 180;
  const MAP = window.TORT_MAP;

  /* ── Színek ─────────────────────────────────────────────── */
  const C = {
    sea: '#c2cfc3', land: '#ecdfc0', coast: '#6b4a26', sepia: '#4a321a', ink: '#33220f',
    river: '#4f7286', red: '#a3271c', gold: '#b8860b', ochre: '#857326', slate: '#44607a', paper: '#f6ecd2',
  };

  /* ── Vetület: Lambert-féle szögtartó kúpvetület ─────────── */
  const P1 = 44 * D2R, P2 = 58 * D2R, LAM0 = 42 * D2R, PHI0 = 50 * D2R;
  const tn = (p) => Math.tan(Math.PI / 4 + p / 2);
  const PN = Math.log(Math.cos(P1) / Math.cos(P2)) / Math.log(tn(P2) / tn(P1));
  const PF = Math.cos(P1) * Math.pow(tn(P1), PN) / PN;
  const RHO0 = PF / Math.pow(tn(PHI0), PN);
  function proj(lon, lat) {
    const rho = PF / Math.pow(tn(lat * D2R), PN), th = PN * (lon * D2R - LAM0);
    return [1000 * rho * Math.sin(th), -1000 * (RHO0 - rho * Math.cos(th))];
  }
  const KM_PER_UNIT = 6.371;
  function northRot(lon, lat) { const a = proj(lon, lat), b = proj(lon, lat + .5); return -Math.atan2(b[0] - a[0], -(b[1] - a[1])); }

  /* ── Görbék ─────────────────────────────────────────────── */
  function spline(pts, per, closed) {            // Catmull–Rom mintavételezés
    const out = [], n = pts.length, g = (i) => closed ? pts[(i + n) % n] : pts[U.clamp(i, 0, n - 1)];
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
      for (let s = 0; s < per; s++) {
        const t = s / per, t2 = t * t, t3 = t2 * t;
        out.push([
          .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
      }
    }
    if (!closed) out.push(pts[n - 1].slice(0, 2));
    return out;
  }
  function haversine(a, b) {
    const dl = (b[0] - a[0]) * D2R, dp = (b[1] - a[1]) * D2R, s = Math.sin(dp / 2) ** 2 + Math.cos(a[1] * D2R) * Math.cos(b[1] * D2R) * Math.sin(dl / 2) ** 2;
    return 2 * 6371 * Math.asin(Math.sqrt(s));
  }
  /* lon/lat töréspontokból: vetített mintasor + kumulált arány */
  function makeTrack(ll, per) {
    const s = spline(ll, per || 14), pts = s.map((p) => proj(p[0], p[1])), cum = [0]; let km = 0;
    for (let i = 1; i < pts.length; i++) { cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); km += haversine(s[i - 1], s[i]); }
    const tot = cum[cum.length - 1]; for (let i = 0; i < cum.length; i++) cum[i] /= tot;
    return { pts, cum, km, per: per || 14 };
  }
  function trackAt(tr, f) {
    f = U.clamp(f); let lo = 0, hi = tr.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tr.cum[m] <= f) lo = m; else hi = m; }
    const t = (f - tr.cum[lo]) / Math.max(1e-9, tr.cum[hi] - tr.cum[lo]), a = tr.pts[lo], b = tr.pts[hi];
    return { x: U.lerp(a[0], b[0], t), y: U.lerp(a[1], b[1], t), i: lo, dx: b[0] - a[0], dy: b[1] - a[1] };
  }

  /* ── Térképadat → Path2D (térkép-koordinátákban) ────────── */
  const landPath = new Path2D(), lakePath = new Path2D(), gratPath = new Path2D();
  const riverPaths = { 1: new Path2D(), 2: new Path2D(), 3: new Path2D() };
  const riverPts = {};
  function addLine(path, flat, close) {
    for (let i = 0; i < flat.length; i += 2) { const p = proj(flat[i] / 100, flat[i + 1] / 100); if (i === 0) path.moveTo(p[0], p[1]); else path.lineTo(p[0], p[1]); }
    if (close) path.closePath();
  }
  MAP.land.forEach((poly) => poly.forEach((r) => addLine(landPath, r, true)));
  MAP.lakes.forEach((r) => addLine(lakePath, r, true));
  MAP.rivers.forEach((r) => {
    addLine(riverPaths[r.w], r.p, false);
    const a = riverPts[r.n] || (riverPts[r.n] = []);
    for (let i = 0; i < r.p.length; i += 2) a.push([r.p[i] / 100, r.p[i + 1] / 100]);
  });
  for (let lon = 0; lon <= 90; lon += 10) for (let lat = 30; lat <= 74; lat += 1) { const p = proj(lon, lat); if (lat === 30) gratPath.moveTo(p[0], p[1]); else gratPath.lineTo(p[0], p[1]); }
  for (let lat = 30; lat <= 70; lat += 10) for (let lon = -5; lon <= 95; lon += 1) { const p = proj(lon, lat); if (lon === -5) gratPath.moveTo(p[0], p[1]); else gratPath.lineTo(p[0], p[1]); }

  /* folyónevek: a megadott ponthoz legközelebbi folyópontra kerülnek */
  const RIVER_LABELS = [
    ['Volga', 46.6, 51.4, 0], ['Don', 40.6, 49.9, 0], ['Dnyeper', 32.2, 50.2, 0], ['Duna', 25.6, 43.8, 0],
    ['Káma', 53.6, 56.2, 3], ['Urál', 53.8, 51.3, 3], ['Ob', 66.5, 61.6, 2.5], ['Irtis', 71.3, 56.4, 2.5], ['Tobol', 64.6, 53.8, 3],
    ['Dnyeszter', 28.4, 48.2, 4], ['Prut', 27.7, 47.4, 6], ['Szeret', 26.9, 46.5, 6.5], ['Tisza', 20.3, 46.3, 6], ['Duna', 18.95, 46.4, 6],
    ['Maros', 22.6, 46.05, 8], ['Dráva', 17.6, 45.95, 8], ['Belaja', 55.9, 53.3, 4],
  ].map((r) => {
    let best = null, bd = 1e9;
    (riverPts[r[0]] || []).forEach((p) => { const d = Math.hypot((p[0] - r[1]) * .62, p[1] - r[2]); if (d < bd) { bd = d; best = p; } });
    best = best || [r[1], r[2]]; return { n: r[0], m: proj(best[0], best[1]), z: r[3] };
  });
  const SEA_LABELS = [
    ['Fekete-tenger', 34.3, 43.3, 0], ['Kaszpi-tenger', 50.7, 42.6, 0], ['Balti-tenger', 19.6, 56.6, 0], ['Aral-tó', 59.9, 45.0, 0], ['Azovi-tenger', 36.6, 46.05, 4.4],
  ].map((s) => ({ n: s[0], m: proj(s[1], s[2]), z: s[3] }));

  /* ── Hegységek (kézzel húzott gerincvonalak) ─────────────── */
  const RANGES = [
    [[59.6, 51.6], [58.4, 53], [58.7, 55], [59.5, 57], [59.3, 59], [59.6, 61], [60.2, 63], [62.5, 65.2], [65.5, 67.6]],
    [[17.2, 48.25], [18.4, 49.15], [20, 49.3], [22, 49.1], [23.2, 48.6], [24.5, 48.0], [25.3, 47.3], [25.9, 46.5], [26.2, 45.75], [25.3, 45.5], [24, 45.5], [22.8, 45.3], [22.4, 44.7]],
    [[37.6, 44.6], [40, 43.6], [43, 43], [46, 42], [48.6, 41]],
    [[9, 46.6], [11.5, 47], [13.5, 47.2], [15.4, 47.4]],
    [[22.6, 43.2], [25, 42.75], [27.4, 42.8]],
  ];
  const PEAKS = [];
  (function () {
    const r = U.rng(7);
    RANGES.forEach((ll, ri) => {
      const tr = makeTrack(ll, 10), len = tr.cum.length, total = (function () { let s = 0; for (let i = 1; i < len; i++) s += Math.hypot(tr.pts[i][0] - tr.pts[i - 1][0], tr.pts[i][1] - tr.pts[i - 1][1]); return s; })();
      const n = Math.max(3, Math.round(total / 5.2));
      for (let i = 0; i <= n; i++) {
        const q = trackAt(tr, i / n), l = Math.hypot(q.dx, q.dy) || 1, off = ((i % 2) ? 1 : -1) * (1.2 + r() * 1.3) * (ri === 0 ? 1.5 : 1);
        PEAKS.push({ x: q.x + (-q.dy / l) * off + (r() - .5), y: q.y + (q.dx / l) * off + (r() - .5), s: .8 + r() * .45 });
      }
    });
    PEAKS.sort((a, b) => a.y - b.y);
  })();

  /* ── A vándorlás útvonala ─────────────────────────────────── */
  const ROUTE_LL = [
    [66.5, 57.4, 'u0'], [66, 55.2, 'ug'], [62, 54.6], [59.2, 54.3], [54.8, 54.7, 'm'], [51, 53.2], [47.5, 51.2], [44, 49.8], [41, 49.2],
    [37.8, 48.8, 'l'], [35, 48.4], [32.5, 48.0], [30, 47.6, 'e'], [27.6, 48.2], [25.2, 48.72, 'a'], [23.15, 48.78, 'v'], [22.3, 48.35], [21.3, 47.8], [20.2, 47.2, 'k'],
  ];
  const ROUTE = makeTrack(ROUTE_LL, 16);
  const SF = {}; ROUTE_LL.forEach((p, i) => { if (p[2]) SF[p[2]] = ROUTE.cum[i * 16]; });
  const ROUTE_KM = Math.round(ROUTE.km / 100) * 100;
  /* j („utazási idő”, 0..7) → útvonal-arány */
  const JF = [0, SF.ug, SF.m, SF.l, SF.e, SF.a, SF.k, SF.k];
  function fracOfJ(j) { if (j <= 0) return 0; if (j >= 7) return JF[7]; const i = Math.floor(j); return U.lerp(JF[i], JF[i + 1], j - i); }

  const JULIANUS = makeTrack([[18.74, 47.79], [20.5, 44.8], [23.3, 42.7], [28.98, 41.01], [33, 42.6], [36.7, 45.2], [41, 46.6], [45.6, 48.4], [46.3, 51.6], [49.1, 54.9], [53.2, 55.0]], 14);

  /* ── Szállásterületek (lon/lat sokszögek, simított foltként) ─ */
  function region(ll, color) {
    const s = spline(ll, 10, true).map((p) => proj(p[0], p[1])), path = new Path2D(); let cx = 0, cy = 0, rad = 0;
    s.forEach((p, i) => { if (i) path.lineTo(p[0], p[1]); else path.moveTo(p[0], p[1]); cx += p[0]; cy += p[1]; }); path.closePath();
    cx /= s.length; cy /= s.length; s.forEach((p) => { rad = Math.max(rad, Math.hypot(p[0] - cx, p[1] - cy)); });
    return { path, cx, cy, rad, color };
  }
  const REG = {
    ural: region([[52, 56], [54, 60], [58, 62.5], [64, 63], [70, 61], [72, 57.5], [69, 54.5], [62, 53.5], [55, 54]], C.ochre),
    ugor: region([[60.3, 53.3], [60.6, 56.2], [64, 57.4], [69, 57.2], [72, 55.5], [70.5, 53.3], [65, 52.5]], C.gold),
    magna: region([[50.5, 53], [50.5, 55.5], [53, 57], [57, 56.8], [58.3, 54.8], [57.5, 52.6], [54, 52.2]], C.red),
    levedia: region([[33.6, 47.2], [33.6, 49.8], [36.5, 51], [40.5, 50.5], [42, 48.6], [40, 47.0], [36.5, 46.6]], C.red),
    etelkoz: region([[26.6, 45.9], [26.6, 48.3], [29, 49.5], [32.5, 49.5], [34.1, 48], [33.5, 46.7], [30.8, 46.1], [29.4, 45.5], [28, 45.4]], C.red),
    karpat: region([[16.5, 47.9], [18, 48.6], [20.5, 48.95], [22.7, 48.55], [24.2, 47.6], [25.4, 46.6], [25.3, 45.75], [23, 45.4], [21.5, 44.9], [19.5, 45.2], [17.3, 45.9], [16.2, 46.8]], C.red),
    kazar: region([[39.5, 45], [42.3, 48.3], [45, 50.3], [49, 49.5], [50, 46.5], [48.2, 43.2], [44.5, 42.9], [40.5, 43.6]], C.slate),
  };
  const ramp = (v, a, b) => U.smooth((v - a) / (b - a));
  /* megjelenés (bloom) és halványulás j függvényében: [megj. kezd, megj. vég, halv. kezd, halv. vég, maradék] */
  const REG_T = { ural: [-.85, -.25, 1.2, 2, .22], ugor: [.3, .9, 1.4, 2.1, .3], magna: [1.5, 2, 2.4, 3.1, .36], levedia: [2.5, 3, 3.4, 4.1, .32], etelkoz: [3.5, 4, 5.5, 6.2, .24], karpat: [5.7, 6.05, 99, 100, 1], kazar: [2.6, 3.1, 99, 100, 1] };

  /* ── Állomás- és népnevek ─────────────────────────────────── */
  const pj = (lon, lat) => proj(lon, lat);
  const STATIONS = [
    { n: 'Uráli őshaza', m: pj(69.6, 60.2), js: -.5, dy: 0, dot: false },
    { n: 'Ugor kori szállások', m: pj(66, 55.2), js: 1, dy: 74 },
    { n: 'Magna Hungaria', m: pj(54.8, 54.7), js: 2, dy: -70 },
    { n: 'Levédia', m: pj(37.8, 48.8), js: 3, dy: -70 },
    { n: 'Etelköz', m: pj(30, 47.6), js: 4, dy: -74 },
    { n: 'Kárpát-medence', m: pj(20.2, 47.2), js: 6, dy: 76 },
  ];
  const NEIGH = [
    { n: 'KAZÁR KAGANÁTUS', m: pj(46.3, 46.1), a: (j) => ramp(j, 2.6, 3.1), col: C.slate },
    { n: 'VOLGAI BOLGÁROK', m: pj(48.6, 55.6), a: (j) => ramp(j, 1.7, 2.1) * (1 - ramp(j, 3.3, 3.8) * .0) },
    { n: 'BESENYŐK', m: pj(53.5, 49.4), a: (j) => ramp(j, 2.6, 3.1) * (1 - ramp(j, 4.3, 4.7)), col: '#7c2a1c' },
    { n: 'BESENYŐK', m: pj(37.6, 47.25), a: (j) => ramp(j, 4.75, 5.1), col: '#7c2a1c' },
    { n: 'BOLGÁR CÁRSÁG', m: pj(25.3, 43.25), a: (j) => ramp(j, 3.6, 4) },
    { n: 'BIZÁNCI BIRODALOM', m: pj(28.2, 41.55), a: (j) => ramp(j, 3.6, 4) },
    { n: 'MORVA FEJEDELEMSÉG', m: pj(17.75, 49.3), ov: 0, a: (j) => ramp(j, 5.3, 5.7) * (1 - ramp(j, 6.6, 6.78) * .7), strike: (j) => ramp(j, 6.62, 6.8) },
    { n: 'KELETI FRANK KIRÁLYSÁG', m: pj(14.9, 47.3), ov: 0, a: (j) => ramp(j, 5.3, 5.7) },
  ];
  const CITIES = [{ n: 'Kijev', m: pj(30.52, 50.45), a: (j) => ramp(j, 2.6, 3) }, { n: 'Konstantinápoly', m: pj(28.98, 41.01), a: (j) => ramp(j, 3.6, 4) }];
  const TRIBES = ['Nyék', 'Megyer', 'Kürtgyarmat', 'Tarján', 'Jenő', 'Kér', 'Keszi'];
  const V_PASS = pj(23.15, 48.8);
  const SETTLE = [[21.6, 48.1], [20.6, 47.6], [21.4, 47.1], [20.3, 46.4], [21.9, 46.5], [19.6, 47.2], [23.4, 47.0], [24.2, 46.4], [23.3, 46.0], [19.3, 46.2], [18.3, 47.3], [17.6, 46.7], [18.2, 46.2], [17.4, 47.6], [18.6, 48.1], [20.4, 45.6], [22.4, 47.6], [24.8, 45.9]].map((p) => { const m = pj(p[0], p[1]); return { m, d: Math.hypot(m[0] - V_PASS[0], m[1] - V_PASS[1]) }; });

  /* ── Kamera lépésenként ───────────────────────────────────── */
  const CAM_LL = [
    [41, 52.2, 1.72], [58.2, 59.4, 3.15], [62.3, 57.8, 3.8], [58.3, 55.2, 4.4], [41.5, 49.3, 4.2],
    [30.3, 47.5, 7], [31.3, 46.3, 4.6], [23.6, 47.3, 8.6], [20.4, 47.0, 9.6], [41, 52.2, 1.72],
  ];
  const CAMS = CAM_LL.map((c) => { const m = proj(c[0], c[1]); return { x: m[0], y: m[1], z: c[2], rot: northRot(c[0], c[1]) }; });
  const CX = 680, CY = 478;
  const cam = { x: 0, y: 0, z: 1, rot: 0, cos: 1, sin: 0 };
  function setCam(sp) {
    const i = U.clamp(Math.floor(sp), 0, CAMS.length - 2), t = U.inOut(U.clamp(sp - i)), a = CAMS[i], b = CAMS[i + 1];
    /* a két nézet közti úton kicsit „felemelkedünk” */
    const lift = 1 - .28 * Math.sin(Math.PI * t) * U.clamp(Math.hypot(b.x - a.x, b.y - a.y) / 250);
    cam.x = U.lerp(a.x, b.x, t); cam.y = U.lerp(a.y, b.y, t); cam.z = Math.exp(U.lerp(Math.log(a.z), Math.log(b.z), t)) * lift; cam.rot = U.lerp(a.rot, b.rot, t);
    cam.cos = Math.cos(cam.rot); cam.sin = Math.sin(cam.rot);
  }
  function S(m) { const dx = (m[0] - cam.x) * cam.z, dy = (m[1] - cam.y) * cam.z; return [CX + dx * cam.cos - dy * cam.sin, CY + dx * cam.sin + dy * cam.cos]; }
  function applyCam(ctx) { ctx.translate(CX, CY); ctx.rotate(cam.rot); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y); }

  /* ── Idővonal ─────────────────────────────────────────────── */
  const TL_YEARS = ['Kr. e. 3000', 'Kr. e. 500', '6–8. sz.?', '830 k.?', '850 k.', '894', '895', '907'];
  const TL_NAMES = ['uráli őshaza', 'ugor kor', 'Magna Hungaria', 'Levédia', 'Etelköz', 'besenyő támadás', 'honfoglalás', 'új haza a Kárpát-medencében'];
  const TL_SHORT = ['uráli őshaza', 'ugor kor', 'Magna Hungaria', 'Levédia', 'Etelköz', '894: támadás', '895: honfoglalás', '907: új haza'];
  const TLX0 = 130, TLX1 = 1250;
  const tlx = (v) => U.lerp(TLX0, TLX1, v / 7);

  /* ── j időzítése lépésenként: [honnan, hová, kezd (s), vég (s)] ─ */
  const JT = [[-1, -1, 0, 1], [-1, 0, .5, 3.2], [0, 1, 1.4, 6.2], [1, 2, 1.2, 6.6], [2, 3, 1.2, 7.2], [3, 4, 1.2, 6.2], [4, 5, 7, 10.5], [5, 6, 1.2, 7.6], [6, 7, .8, 10]];
  const st9 = { auto: true, j: 0, slider: null, jul: false, julT: 0 };

  /* ── Textúrák ─────────────────────────────────────────────── */
  let texSea, texOver;
  function makeTextures() {
    const r = U.rng(11);
    texSea = document.createElement('canvas'); texSea.width = 1920; texSea.height = 1080;
    let c = texSea.getContext('2d'); c.fillStyle = C.sea; c.fillRect(0, 0, 1920, 1080);
    for (let i = 0; i < 70; i++) {
      const x = r() * 1920, y = r() * 1080, rad = 80 + r() * 320, g = c.createRadialGradient(x, y, 0, x, y, rad);
      const col = r() < .5 ? '120,150,150' : '215,205,170'; g.addColorStop(0, `rgba(${col},${.05 + r() * .09})`); g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    /* szemcse + foltok + vignetta: szorzó (multiply) réteg */
    const tile = document.createElement('canvas'); tile.width = tile.height = 256; const tc = tile.getContext('2d'), id = tc.createImageData(256, 256);

    moving += ((sp1 > .0015 ? 1 : 0) - moving) * (1 - Math.exp(-L.dt * 5)); phase += L.dt * (4 + moving * 9);

      const q = trackAt(ROUTE, frac), h = S([q.x, q.y]), q2 = S([q.x + q.dx, q.y + q.dy]); let dx = q2[0] - h[0], dy = q2[1] - h[1]; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      if (Math.abs(dx) > .15) bandDir = dx < 0 ? -1 : 1;
      const s = U.clamp(.78 + cam.z * .1, .95, 1.62), idle = 1 - moving, nx = -dy, ny = dx;
      ctx.save(); ctx.globalAlpha = ba;
      /* porfelhő menet közben, füst a táborban */
      for (let i = 0; i < 9; i++) { const ph = (L.t * .9 + i / 9) % 1, bx = h[0] - dx * (30 + ph * 80 + i * 9) * s + nx * Math.sin(i * 2.4) * 16 * s, by = h[1] - dy * (30 + ph * 80 + i * 9) * s + ny * Math.sin(i * 2.4) * 16 * s - ph * 14; ctx.beginPath(); ctx.arc(bx, by, (5 + ph * 12) * s, 0, U.TAU); ctx.fillStyle = `rgba(150,115,65,${.3 * (1 - ph) * moving})`; ctx.fill(); }
      const items = [];
      const lay = [[0, 0], [-24, -11], [-28, 13], [-50, 2], [-54, -17], [-60, 19], [-80, -6], [-86, 11], [-106, 1]];
      lay.forEach((o, i) => {
        const ia = i / lay.length * U.TAU + .4, ix = Math.cos(ia) * (40 + (i % 3) * 9), iy = Math.sin(ia) * (22 + (i % 2) * 8) + 8;
        const mx = dx * o[0] + nx * o[1], my = dy * o[0] + ny * o[1] * .8;
        const x = h[0] + U.lerp(mx, ix, idle) * s, y = h[1] + U.lerp(my, iy, idle) * s;
        const d = idle > .6 ? (ix > 0 ? -1 : 1) : bandDir; items.push({ y, f: () => rider(x, y + 8 * s, s, d, phase + i * 1.3, moving, i === 0) });
      });
      [[-17, -4], [17, -8], [0, 14]].forEach((o, i) => { const x = h[0] + o[0] * s, y = h[1] + o[1] * s; items.push({ y: y - 2, f: () => yurt(x, y + 6 * s, s * 1.02, U.clamp(idle * 2 - .6 - i * .15)) }); });
      items.sort((a, b) => a.y - b.y).forEach((it) => it.f());
      for (let i = 0; i < 5; i++) { const ph = (L.t * .22 + i / 5) % 1; ctx.beginPath(); ctx.arc(h[0] + Math.sin(ph * 5 + i) * 6 * s + ph * 10, h[1] - (18 + ph * 54) * s, (3 + ph * 8) * s, 0, U.TAU); ctx.fillStyle = `rgba(90,70,45,${.22 * (1 - ph) * U.clamp(idle * 2 - 1)})`; ctx.fill(); }
      ctx.restore();
    }

    /* nyelvcsalád-fa (1–2. lépés) */
    drawTree(U.clamp(Math.min(sp - .45, 2.55 - sp) * 2.2) * (L.step === 1 ? U.clamp((L.st - .5) * 1.6) : 1));

    drawCompass();
    drawTimeline(j);

    /* pergamen-szemcse + vignetta + keret */
    drawFrame();
  }

  /* ── Lépések ──────────────────────────────────────────────── */
  const steps = [
    { title: 'Honnan jöttünk?',
      text: `<p>A magyarság ősei <span class="key">több ezer kilométert</span> és több ezer évet vándoroltak, mire 895-ben megérkeztek a Kárpát-medencébe.</p>
             <p>Kövessük végig az utat a térképen: az Urál vidékétől a Vereckei-hágóig.</p>
             <p class="note">A korai állomások helye és ideje vitatott – a térkép a ma legelfogadottabb képet mutatja.</p>` },
    { title: 'Az uráli őshaza',
      text: `<p>Kr. e. 4000 körül az <span class="key">uráli népek</span> ősei az Urál hegység két oldalán éltek: halásztak, vadásztak, gyűjtögettek.</p>
             <p>Erről a <span class="key2">nyelv</span> tanúskodik: a <em>hal, nyíl, íj, víz, fa</em> szavaink uráli örökségek.</p>
             <p>A közösség lassan szétvált – a nyelvcsalád fája mutatja, hogyan.</p>` },
    { title: 'Az ugor kor: lóra szállunk',
      text: `<p>Az <span class="key">ugor</span> közösség az Uráltól keletre, a nyugat-szibériai erdős sztyeppén élt. Itt tanulták meg őseink a <span class="key2">lótartást</span>: <em>ló, nyereg, fék, ostor</em> – mind ugor kori szó.</p>
             <p>Kr. e. 1000–500 között az egység felbomlott: az <span class="key">obi-ugorok</span> északra húzódtak, az ősmagyarok a sztyeppe szélén maradtak.</p>` },
    { title: 'Magna Hungaria',
      text: `<p>Az ősmagyarok átkeltek az Urálon, és a <span class="key">Volga–Káma–Urál</span> vidékén, a mai Baskíria táján telepedtek meg. Ez <span class="key">Magna Hungaria</span>, a „régi Magyarország”.</p>
             <p class="note">Mikor? A régebbi kutatás az 5–6. századra tette az átkelést; az újabb régészeti és genetikai eredmények szerint a magyarok csak a 9. század elején indultak tovább – és gyorsan haladtak.</p>` },
    { title: 'Levédia: a kazárok szomszédságában',
      text: `<p>A <span class="key">Don és a Dnyeper</span> közti sztyeppén a magyarok a <span class="key2">Kazár Kaganátus</span> szövetségesei, részben alattvalói lettek.</p>
             <p>Török népektől tanultak földművelést (<em>búza, árpa, eke, ökör</em>), és kialakult a <span class="key">kettős fejedelemség</span>: a szakrális <b>kende</b> mellett a hadvezér <b>gyula</b> kormányzott.</p>` },
    { title: 'Etelköz: a hét törzs szövetsége',
      text: `<p>A 9. század közepén a magyarok nyugatabbra, a <span class="key">Dnyeper és az Al-Duna</span> közé költöztek: ez <span class="key">Etelköz</span>, a „folyóköz”.</p>
             <p>A <span class="key2">hét törzs</span> a hagyomány szerint vérszerződéssel szövetkezett; fejedelmük Álmos, majd fia, <b>Árpád</b> lett. Csatlakoztak hozzájuk a kazároktól elszakadt <b>kabarok</b> is.</p>` },
    { title: '894–895: két tűz között',
      text: `<p>894-ben a magyar fősereg <span class="key2">Bizánc szövetségében</span> a dunai bolgárok ellen vonult.</p>
             <p>Simeon bolgár cár válaszul a <span class="key">besenyőket</span> hívta segítségül: ők keletről rátörtek a védtelenül maradt etelközi szállásokra.</p>
             <p>Maradni nem lehetett – a nép nyugatra, a Kárpátok hágói felé indult.</p>` },
    { title: '895: a honfoglalás',
      text: `<p>A fősereg Árpád vezetésével a <span class="key">Vereckei-hágón</span> kelt át, más csapatok az <span class="key2">erdélyi hágókon</span> és szorosokon érkeztek.</p>
             <p>Nem ismeretlen földre jöttek: magyar seregek <b>862</b> óta többször jártak a Kárpát-medencében. A honfoglalás ezért nemcsak menekülés, hanem előkészített költözés is volt.</p>` },
    { title: 'Új haza a Kárpát-medencében',
      text: `<p><span class="key">895</span>: az Alföld és Erdély birtokbavétele.<br><span class="key">900</span>: a Dunántúl elfoglalása.<br><span class="key">902</span>: a Morva Fejedelemség bukása.</p>
             <p><span class="key2">907</span>-ben a <b>pozsonyi csatában</b> a magyarok megsemmisítették a rájuk törő keleti frank (bajor) sereget – az új haza végleg biztosítva lett.</p>` },
    { title: 'Az egész út – egy csúszkán',
      text: `<p>Húzd a csúszkát, és járd be újra az utat az Uráltól a Kárpátokig!</p>
             <p class="note">Utóirat: <b>Julianus barát</b> 1235–36-ban a Volga vidékén még talált magyarul beszélő népet – a keleten maradt magyarokat. Néhány év múlva a mongol hódítás elsöpörte őket.</p>`,
      enter() { st9.auto = true; st9.j = 0; st9.jul = false; st9.julT = 0; },
      controls(L) {
        st9.slider = L.slider({ label: 'Idő', min: 0, max: 7, step: 0.01, value: 0, format: (v) => TL_SHORT[Math.round(v)], onInput: (v) => { st9.auto = false; st9.j = v; } });
        L.button('▶ Lejátszás', () => { st9.auto = true; L.st = 1.6; st9.j = 0; });
        L.button('Julianus útja', (b) => { st9.jul = !st9.jul; b.classList.toggle('on', st9.jul); });
      } },
  ];

  L = Lesson.create({
    subject: 'Történelem',
    title: 'A magyarok vándorlása az őshazától a Kárpát-medencéig',
    steps,
    init(L) {
      makeTextures();
