<script>
(function () {
'use strict';

const HOT = '#ff7a48', COLD = '#56c8ff', HEAT = '#ffc45c', INK = '#eaf1ff', MUT = '#8ea2c6', ELEC = '#ffe66b';
const FB = '"Bricolage Grotesque"', FD = 'Fraunces', FM = '"JetBrains Mono"';
const P_LOW = 0.6, P_HIGH = 5.5, T_ROOM = 22, T_IN = 4;
let c, GA = 1, L;

/* ── kis segédek ─────────────────────────────────────────────── */
const al = (a) => { c.globalAlpha = GA * clamp(a); };

function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
const TS = [[-25, [70, 190, 255]], [22, [228, 224, 216]], [70, [255, 92, 50]]];
function trgb(T) {

  return [0, 1, 2].map((i) => Math.round(lerp(a[1][i], b[1][i], f)));
}
const tcol = (T, a = 1) => { const r = trgb(T); return `rgba(${r[0]},${r[1]},${r[2]},${a})`; };
/* izobután (R600a) telítési görbéje — Antoine-egyenlet */
const psat = (T) => Math.pow(10, 6.91048 - 946.35 / (246.68 + T)) / 750.062;       // bar
const tboil = (p) => 946.35 / (6.91048 - Math.log10(p * 750.062)) - 246.68;        // °C
const TB_LOW = Math.round(tboil(P_LOW)), TB_HIGH = Math.round(tboil(P_HIGH));      // −24, +41

function heatArrow(x, y, ang, len, a, ph = 0, w = 3.5) {
  if (a <= 0.01) return;
  c.save(); c.translate(x, y); c.rotate(ang); al(a); c.strokeStyle = HEAT; c.fillStyle = HEAT; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath();

}
function badge(n, x, y, on = 1, r = 19) {
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = on > .5 ? INK : 'rgba(234,241,255,.14)'; c.fill();
  tx(String(n), x, y + 1, { f: FM, s: r * 1.1, w: 700, a: 'center', b: 'middle', c: on > .5 ? '#06101f' : INK });
}
function background() {
  c.globalAlpha = 1;
  const g = c.createRadialGradient(620, 420, 80, 620, 540, 1500); g.addColorStop(0, '#0d1b33'); g.addColorStop(1, '#040912');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.strokeStyle = 'rgba(140,180,255,.045)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= 1920; x += 40) { c.moveTo(x + .5, 0); c.lineTo(x + .5, 1080); }

  c.stroke();
}

/* ── útvonal-segédek ─────────────────────────────────────────── */
function roundPoly(pts, r) {
  const o = [], push = (x, y) => o.push([x, y]);

  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    const d1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), d2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    if (d1 < .01 || d2 < .01) continue;
    const q = Math.min(r, d1 / 2, d2 / 2);
    const a = [p1[0] + (p0[0] - p1[0]) / d1 * q, p1[1] + (p0[1] - p1[1]) / d1 * q], b = [p1[0] + (p2[0] - p1[0]) / d2 * q, p1[1] + (p2[1] - p1[1]) / d2 * q];

}
function resample(poly, ds) {
  const o = [[poly[0][0], poly[0][1]]]; let carry = 0;
  for (let i = 1; i < poly.length; i++) {
    const a = poly[i - 1], b = poly[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]); if (d < 1e-6) continue;
    let pos = ds - carry;
    while (pos <= d) { o.push([lerp(a[0], b[0], pos / d), lerp(a[1], b[1], pos / d)]); pos += ds; }

}
const rows = (xA, xB, y0, dy, n) => { const o = []; for (let i = 0; i < n; i++) { const y = y0 + i * dy; if (i % 2 === 0) o.push([xA, y], [xB, y]); else o.push([xB, y], [xA, y]); } return o; };

/* ════════════════════════════════════════════════════════════════
   D jelenet: a teljes hűtőkör
   ════════════════════════════════════════════════════════════════ */
const SEC = [
  { pts: [[500, 620], [500, 985], [720, 985]] },                                        // 0 szívóvezeték
  { pts: [[720, 985], [840, 985]] },                                                    // 1 kompresszor
  { pts: [[840, 985], [1280, 985], [1280, 880]] },                                      // 2 nyomóvezeték
  { pts: [[1280, 880], ...rows(1280, 1010, 770, -56, 11), [1010, 120]] },               // 3 kondenzátor
  { pts: [[1010, 120], [1010, 52], [880, 52]] },                                        // 4 folyadékvezeték
  { pts: [[880, 52], [640, 52]] },                                                      // 5 kapillárcső
  { pts: [[640, 52], [500, 52], ...rows(500, 340, 200, 50, 8), [500, 620]] },           // 6 elpárologtató
];
/* állapot a szakasz mentén (f = 0..1): [hőmérséklet °C, folyadékhányad, sűrűség-súly, nagy nyomás?] */
function stateAt(sec, f) {
  switch (sec) {
    case 0: return [-15, 0, .8, 0];
    case 1: return [lerp(-15, 70, smooth(f)), 0, lerp(.8, 1.3, f), f > .5 ? 1 : 0];
    case 2: return [lerp(70, 66, f), 0, 1.3, 1];
    case 3: { if (f < .12) return [lerp(66, TB_HIGH, f / .12), 0, 1.3, 1]; if (f < .86) { const q = (f - .12) / .74; return [TB_HIGH, q, lerp(1.3, 3.2, q), 1]; } return [lerp(TB_HIGH, 35, (f - .86) / .14), 1, 3.2, 1]; }
    case 4: return [35, 1, 3.2, 1];
    case 5: { const q = smooth((f - .45) / .55); return [lerp(35, TB_LOW, q), lerp(1, .72, q), lerp(3.2, 2.4, q), f < .6 ? 1 : 0]; }
    default: { if (f < .9) { const q = f / .9; return [TB_LOW, .72 * (1 - q), lerp(2.4, .8, q), 0]; } return [lerp(TB_LOW, -15, (f - .9) / .1), 0, .8, 0]; }
  }
}
const PT = { x: [], y: [], nx: [], ny: [], sec: [], T: [], liq: [], M: [], col: [] }; let PN = 0;
const secPath = [], secChunks = [], secRange = [];
function buildLoop() {
  const DS = 4; let mass = 0;
  SEC.forEach((s, si) => {
    const sm = resample(roundPoly(s.pts, 20), DS), n = sm.length - 1, start = PT.x.length;
    const p2 = new Path2D(); p2.moveTo(sm[0][0], sm[0][1]); for (let i = 1; i <= n; i++) p2.lineTo(sm[i][0], sm[i][1]); secPath.push(p2);
    const chunks = [];
    for (let i = 0; i < n; i++) {
      const f = i / n, st = stateAt(si, f), a = sm[i], b = sm[i + 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      PT.x.push(a[0]); PT.y.push(a[1]); PT.nx.push(-(b[1] - a[1]) / d); PT.ny.push((b[0] - a[0]) / d);
      PT.sec.push(si); PT.col.push(tcol(st[0])); PT.T.push(st[0]); PT.liq.push(st[1]); PT.M.push(mass); mass += st[2];
      if (i % 5 === 0) { const e = Math.min(n, i + 5); const cp = new Path2D(); cp.moveTo(a[0], a[1]); for (let k = i + 1; k <= e; k++) cp.lineTo(sm[k][0], sm[k][1]); chunks.push([cp, tcol(stateAt(si, (i + 2.5) / n)[0], 1)]); }
    }
    secChunks.push(chunks); secRange.push([start, PT.x.length]);
  });

}
const NP = 1500, parts = [];
const fa = [1, 1, 1, 1, 1, 1, 1];            // szakaszonkénti kiemelés (simítva)
const FOCUS = { 4: [1, 1, 1, .16, .16, .16, .16], 5: [.16, .16, 1, 1, 1, .16, .16], 6: [.16, .16, .16, .16, 1, 1, .7], 7: [1, .16, .16, .16, .16, .7, 1] };
const sim = { flow: 1, on: true, Tin: T_IN, u: 0, btn: null };

function drawFridge() {
  // konyha felőli meleg derengés
  al(.5); let g = c.createRadialGradient(1150, 500, 40, 1150, 500, 520); g.addColorStop(0, 'rgba(255,122,72,.13)'); g.addColorStop(1, 'rgba(255,122,72,0)'); c.fillStyle = g; c.fillRect(620, 0, 800, 1080);
  al(1);
  rr(60, 100, 500, 790, 24); c.fillStyle = '#152847'; c.fill(); c.strokeStyle = 'rgba(170,200,255,.38)'; c.lineWidth = 2; c.stroke();
  rr(86, 126, 448, 738, 10); c.fillStyle = '#081428'; c.fill();
  const warm = clamp((sim.Tin - T_IN) / 14);
  g = c.createLinearGradient(0, 126, 0, 864); g.addColorStop(0, U.mix('#2a6fa8', '#6a5560', warm)); g.addColorStop(1, U.mix('#12355c', '#3a3038', warm));
  al(.42); rr(86, 126, 448, 738, 10); c.fillStyle = g; c.fill(); al(1);
  // szigetelés sraffozása
  c.save(); rr(60, 100, 500, 790, 24); c.clip(); c.strokeStyle = 'rgba(170,200,255,.10)'; c.lineWidth = 1.5; c.beginPath();
  for (let k = -800; k < 600; k += 14) { c.moveTo(60 + k, 890); c.lineTo(60 + k + 790, 100); } c.stroke();
  rr(86, 126, 448, 738, 10); c.fillStyle = '#081428'; c.globalCompositeOperation = 'destination-over'; c.restore();
  // belső tér újra (a sraffozás fölé)
  rr(86, 126, 448, 738, 10); c.fillStyle = '#081428'; c.fill(); al(.42); c.fillStyle = g; c.fill(); al(1);
  // elpárologtató lemez
  rr(320, 174, 202, 402, 14); c.fillStyle = 'rgba(160,205,255,.07)'; c.fill(); c.strokeStyle = 'rgba(160,205,255,.22)'; c.lineWidth = 1.5; c.stroke();
  // polcok + ételek
  c.strokeStyle = 'rgba(200,225,255,.38)'; c.lineWidth = 3; c.beginPath(); for (const y of [342, 532, 712]) { c.moveTo(96, y); c.lineTo(306, y); } c.stroke();
  al(.9);
  rr(124, 246, 58, 94, 6); c.fillStyle = '#dfe8f5'; c.fill(); c.fillStyle = '#3d7fd1'; c.fillRect(124, 284, 58, 22); c.beginPath(); c.moveTo(124, 248); c.lineTo(153, 226); c.lineTo(182, 248); c.closePath(); c.fillStyle = '#c9d5e8'; c.fill();   // tej
  c.beginPath(); c.arc(246, 314, 26, 0, TAU); c.fillStyle = '#d9534a'; c.fill(); c.strokeStyle = '#5d7a3a'; c.lineWidth = 4; c.beginPath(); c.moveTo(246, 290); c.quadraticCurveTo(250, 276, 260, 272); c.stroke();   // alma
  c.beginPath(); c.moveTo(118, 530); c.lineTo(212, 530); c.lineTo(212, 482); c.closePath(); c.fillStyle = '#f0c75e'; c.fill(); c.fillStyle = '#c99a2e'; for (const [x, y, r] of [[196, 514, 6], [176, 522, 4], [202, 498, 4]]) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }   // sajt
  rr(244, 436, 36, 94, 8); c.fillStyle = '#4f9a6a'; c.fill(); rr(254, 404, 16, 36, 4); c.fill(); c.fillStyle = '#e9eef7'; c.fillRect(244, 468, 36, 26);   // üveg
  rr(126, 644, 62, 66, 8); c.fillStyle = '#b5563f'; c.fill(); rr(122, 634, 70, 14, 4); c.fillStyle = '#d7dde8'; c.fill();   // befőtt
  for (const x of [226, 258]) { c.beginPath(); c.ellipse(x, 692, 14, 18, 0, 0, TAU); c.fillStyle = '#efe3cf'; c.fill(); }   // tojás
  al(1);
  rr(98, 742, 214, 108, 10); c.fillStyle = 'rgba(190,220,255,.10)'; c.fill(); c.strokeStyle = 'rgba(200,225,255,.30)'; c.lineWidth = 2; c.stroke();
  al(.85); for (const [x, y, r, col] of [[150, 806, 30, '#5fa35a'], [212, 812, 24, '#e0803a'], [262, 808, 26, '#6db068']]) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = col; c.fill(); }
  al(1);
  tx('HŰTŐTÉR', 104, 166, { f: FM, s: 20, c: MUT, ls: '2px' });
  tx(fmtT(sim.Tin, 1), 102, 212, { f: FD, s: 44, w: 560, c: U.mix('#56c8ff', '#ffb08a', warm) });
  tx('KONYHA', 1040, 858, { f: FM, s: 20, c: MUT, ls: '2px' });
  tx(fmtT(T_ROOM), 1038, 906, { f: FD, s: 44, w: 560, c: '#ffb08a' });
  // kondenzátor-rács függőleges pálcái
  al(.22); c.strokeStyle = '#c8d6f0'; c.lineWidth = 2; c.beginPath(); for (let x = 1034; x <= 1260; x += 25) { c.moveTo(x, 190); c.lineTo(x, 790); } c.stroke(); al(1);
}

function drawLoop() {
  const t = L.t;
  // csövek
  for (let s = 0; s < 7; s++) {
    const a = fa[s], cap = s === 5, hi = s === 2 || s === 3 || s === 4;
    c.lineCap = 'round'; c.lineJoin = 'round';
    al(a * .75); c.strokeStyle = s === 1 ? 'rgba(200,210,235,.5)' : hi ? 'rgba(255,128,84,.75)' : cap ? 'rgba(210,190,220,.7)' : 'rgba(92,196,255,.75)'; c.lineWidth = cap ? 12 : 25; c.stroke(secPath[s]);
    al(a); c.strokeStyle = '#06101f'; c.lineWidth = cap ? 8 : 20; c.stroke(secPath[s]);
    al(a * .2); c.lineWidth = cap ? 8 : 20; c.lineCap = 'butt'; for (const [p, col] of secChunks[s]) { c.strokeStyle = col; c.stroke(p); }
  }
  // kapillárcső tekercs-jelzése
  al(fa[5] * .8); c.strokeStyle = 'rgba(210,190,220,.75)'; c.lineWidth = 2.5; for (let x = 690; x <= 830; x += 20) { c.beginPath(); c.ellipse(x, 52, 8, 22, 0, 0, TAU); c.stroke(); }
  // részecskék
  sim.u = (sim.u + L.dt * 0.0135 * sim.flow) % 1;
  for (let i = 0; i < NP; i++) {
    const p = parts[i]; let u = p.u + sim.u; if (u >= 1) u -= 1;
    let lo = 0, hi = PN; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (PT.M[m] <= u) lo = m; else hi = m; }
    const j = lo + 1 < PN ? lo + 1 : 0, f = (u - PT.M[lo]) / ((PT.M[lo + 1] - PT.M[lo]) || 1), s = PT.sec[lo], a = fa[s]; if (a < .02) continue;
    const liquid = p.q < PT.liq[lo], narrow = s === 5 ? .32 : 1;
    const off = (liquid ? p.off * 5.2 : p.off * 6.4 + Math.sin(t * 7 + p.ph) * 1.6 * sim.flow) * narrow;
    const x = lerp(PT.x[lo], PT.x[j], f) + PT.nx[lo] * off, y = lerp(PT.y[lo], PT.y[j], f) + PT.ny[lo] * off;
    c.globalAlpha = GA * a * (liquid ? .96 : .78); c.fillStyle = PT.col[lo];
    c.beginPath(); c.arc(x, y, (liquid ? 4.1 : 2.5) * (s === 5 ? .7 : 1), 0, TAU); c.fill();
  }

  const ca = Math.max(fa[1], .3); al(ca);
  let g = c.createRadialGradient(762, 950, 6, 780, 975, 70); g.addColorStop(0, '#3a4a6c'); g.addColorStop(1, '#0c1526');
  c.beginPath(); c.arc(780, 975, 62, 0, TAU); c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(200,215,245,.55)'; c.lineWidth = 2.5; c.stroke();
  c.save(); c.translate(780, 975); c.rotate(t * 5 * sim.flow + sim.u * 400); c.strokeStyle = 'rgba(200,215,245,.5)'; c.lineWidth = 3;
  c.beginPath(); c.arc(0, 0, 34, 0, TAU); c.stroke(); c.beginPath(); c.arc(13, 0, 15, 0, TAU); c.fillStyle = 'rgba(200,215,245,.22)'; c.fill(); c.stroke(); c.restore();
  // villám
  const pul = .6 + .4 * Math.sin(t * 9); al(ca * sim.flow * pul);
  c.save(); c.translate(780, 975); c.fillStyle = ELEC; c.shadowColor = ELEC; c.shadowBlur = 18; c.beginPath(); c.moveTo(6, -24); c.lineTo(-12, 4); c.lineTo(-1, 4); c.lineTo(-6, 24); c.lineTo(12, -4); c.lineTo(1, -4); c.closePath(); c.fill(); c.restore();
  // hőnyilak: kondenzátor (kifelé), elpárologtató (befelé)
  for (let i = 0; i < 12; i++) {
    const ph = (t * .42 + i / 12 + (i * .37) % 1) % 1, ax = 1026 + ((i * 97) % 240), ay = 250 + ((i * 173) % 500);
    heatArrow(ax + ph * 46, ay - ph * 80, -1.05, 44, Math.sin(ph * Math.PI) * fa[3] * sim.flow * .95, t * 5 + i);
  }
  for (let i = 0; i < 9; i++) {
    const ph = (t * .4 + i / 9 + (i * .53) % 1) % 1, ay = 228 + ((i * 131) % 330);
    heatArrow(196 + ph * 96, ay + Math.sin(i) * 6, 0, 44, Math.sin(ph * Math.PI) * fa[6] * sim.flow * .95, t * 5 + i);
  }
  // feliratok
  const lab = (n, x, y, name, sA, ls = '1.5px') => { al(.35 + .65 * sA); badge(n, x, y, sA); tx(name, x + 30, y + 7, { f: FM, s: 20, w: 600, ls, c: INK }); };
  lab(1, 664, 896, 'KOMPRESSZOR', fa[1]); lab(2, 1048, 146, 'KONDENZÁTOR', fa[3] * (fa[2] > .5 || L.step !== 4 ? 1 : .2));
  lab(3, 690, 112, 'KAPILLÁRCSŐ', fa[5] > .9 ? 1 : fa[5]); lab(4, 286, 150, 'ELPÁROLOGTATÓ', fa[6] > .9 ? 1 : fa[6] * .6, '0.4px');
  al(.9); tx('KIS NYOMÁS · ' + fmt(P_LOW, 1) + ' bar', 90, 1042, { f: FM, s: 20, w: 600, c: COLD, ls: '1px' });

    { title: 'A körfolyamat négy állomása',
      text: `<p>Zárt csőben ugyanaz a hűtőközeg kering körbe-körbe. Két oldala van:</p>
             <ul><li><span class="key2">kis nyomás</span> a hűtő belsejében – itt forr, és hőt vesz fel;</li>
             <li><span class="key">nagy nyomás</span> a hátulján – itt lecsapódik, és hőt ad le.</li></ul>
             <p>A két oldalt a kompresszor és a szűk kapillárcső választja el.</p>` },
    { title: 'Kompresszor: összenyomja a gázt',
      text: `<p>A motor a hideg, ritka gázt <span class="key">mintegy kilencszeres nyomásra</span> sűríti. Az összenyomott gáz felforrósodik – mint a biciklipumpa vége.</p>
             <p>Ez az egyetlen pont, ahol <b>villamos energiát</b> fektetünk be. Ezt halljuk, amikor a hűtő „zúg”.</p>` },
    { title: 'Kondenzátor: hőt ad le a konyhának',
      text: `<p>A hátsó rácsban a gáz +70 °C-os, <span class="key">melegebb a konyhánál</span> – a hő így magától kifelé áramlik.</p>
             <p>Nagy nyomáson a gáz már ${fmtT(TB_HIGH)}-on <b>lecsapódik</b>, és közben leadja a párolgáshőjét. Ezért meleg a hűtő háta.</p>` },
    { title: 'Kapillárcső: hirtelen nyomásesés',
      text: `<p>A meleg folyadék egy hajszálvékony csövön préselődik át. A túloldalon a nyomás <span class="key2">${fmt(P_HIGH, 1)}-ről ${fmt(P_LOW, 1)} barra</span> esik.</p>
             <p>Ezen a nyomáson a forráspont ${fmtT(TB_LOW)}: a folyadék egy része azonnal elpárolog, és ezzel <b>saját magát hűti le</b>.</p>` },
    { title: 'Elpárologtató: forr a hűtő belsejében',
      text: `<p>A ${fmtT(TB_LOW)}-os közeg <span class="key2">hidegebb a hűtőtérnél</span>, ezért a hő az ételekből magától áramlik bele.</p>
             <p>A folyadék ettől <b>felforr</b>, a párolgás pedig elviszi a hőt. A hideg gázt a kompresszor szívja el – és a kör újraindul.</p>` },
    { title: 'Mérleg: honnan hová megy az energia?',
      enter() { sim.on = true; },
      text: `<p>A konyhába <span class="key">több hő</span> jut, mint amennyit a hűtőtérből kivettünk: hozzáadódik a kompresszor munkája is.</p>
             <p class="big-fx" style="font-size:38px">Q<sub>meleg</sub> = Q<sub>hideg</sub> + W</p>
             <p>Ezért nem hűl le a konyha nyitott hűtőajtótól. A klíma és a hőszivattyú <b>ugyanez a gép</b>.</p>`,
      controls(L) {
        const b = L.button('Kompresszor kikapcsolása', () => { sim.on = !sim.on; b.textContent = sim.on ? 'Kompresszor kikapcsolása' : 'Kompresszor bekapcsolása'; b.classList.toggle('on', !sim.on); });
      } },
  ],
  init(Lx) {
    L = Lx; c = L.ctx; buildLoop(); buildA(); resetB(); resetC();
    const r = U.rng(2024); for (let i = 0; i < NP; i++) parts.push({ u: (i + r()) / NP, off: r() * 2 - 1, q: r(), ph: r() * TAU });
  },
  draw(Lx) {
    L = Lx; c = L.ctx; GA = 1; background();
    const sp = L.sp, w = (k) => clamp(1 - Math.abs(sp - k) * 2);
    for (let i = 0; i < 3; i++) if (L.step === i) sT[i] = L.st;
    const wA = w(0), wB = w(1), wC = w(2), wD = clamp((sp - 2.5) * 2);
    if (wA > .005) { GA = wA; sceneA(sT[0]); }
    if (wB > .005) { GA = wB; sceneB(sT[1], L.step === 1); }
    if (wC > .005) { GA = wC; sceneC(sT[2], L.step === 2); }
    if (wD > .005) { GA = wD; sceneD(); }
    c.globalAlpha = 1;
  },
});
})();
</script>
</body>
</html>
